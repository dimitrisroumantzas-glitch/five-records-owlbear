<!doctype html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The Weight Room</title>
  <link rel="stylesheet" href="./styles.css?v=600">
</head>
<body>
<main class="game-shell">
  <section id="scene" class="scene">
    <div id="sceneBg" class="scene-bg"></div>
    <div class="vignette"></div>
    <div class="ambient-glow"></div>
    <div id="dustLayer" class="dust-layer"></div>

    <div id="intro" class="intro">
      <span>Hollow Archive</span>
      <strong>The Weight Room</strong>
    </div>

    <section class="doors" aria-label="Τρεις πέτρινες θύρες">
      <div class="door door-left" data-door="0"><div class="arch"><div class="seal"></div><div class="door-frame"><i class="panel l"></i><i class="panel r"></i></div></div></div>
      <div class="door door-center" data-door="1"><div class="arch"><div class="seal"></div><div class="door-frame"><i class="panel l"></i><i class="panel r"></i></div></div></div>
      <div class="door door-right" data-door="2"><div class="arch"><div class="seal"></div><div class="door-frame"><i class="panel l"></i><i class="panel r"></i></div></div></div>
    </section>

    <section id="pedestals" class="pedestals" aria-label="Τέσσερα πέτρινα βάθρα"></section>

    <div class="stone-rack">
      <div class="rack-edge"></div>
      <section id="stoneTray" class="stone-tray" aria-label="Πέτρινα βάρη"></section>
    </div>

    <div id="hint" class="hint hidden"></div>
    <div id="success" class="success hidden"><span>Ο μηχανισμός ισορρόπησε.</span></div>
    <div id="flash" class="flash"></div>

    <button id="fullscreenBtn" class="rune-control fullscreen-control" type="button" aria-label="Πλήρης οθόνη">⛶</button>
    <button id="gmToggle" class="rune-control gm-control hidden" type="button" aria-label="Έλεγχος Αφηγητή">✦</button>

    <aside id="gmDrawer" class="gm-drawer hidden">
      <div class="gm-title">Έλεγχος Αφηγητή</div>
      <label>Πραγματική θύρα
        <select id="doorSelect">
          <option value="0">Αριστερή</option>
          <option value="1">Μεσαία</option>
          <option value="2">Δεξιά</option>
        </select>
      </label>
      <button id="hint1Btn">Investigation DC 12</button>
      <button id="hint2Btn">Investigation DC 14</button>
      <button id="hideHintsBtn">Απόκρυψη ένδειξης</button>
      <button id="resetBtn" class="danger">Επαναφορά γρίφου</button>
      <details><summary>Διαγνωστικά</summary><div id="diagnostics"></div></details>
    </aside>
  </section>
</main>

<script type="module">
const parts=Array.from({length:9},(_,i)=>`./assets/scene/part${String(i+1).padStart(2,"0")}.txt?v=600`);
const bg=(await Promise.all(parts.map(async u=>{const r=await fetch(u);if(!r.ok)throw new Error("Αποτυχία φόρτωσης background: "+u);return(await r.text()).trim();}))).join("");
document.getElementById("sceneBg").style.backgroundImage=`url(data:image/webp;base64,${bg})`;
</script>
<script type="module" src="./app.js?v=600"></script>
</body>
</html>
