<!doctype html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Weight Room</title>
<link rel="stylesheet" href="./styles.css?v=200">
</head>
<body>
<main id="game" class="game">
  <div class="scene-art"></div>
  <div class="scene-shade"></div>
  <div class="dust" aria-hidden="true"></div>
  <div class="torch-glow glow-left"></div>
  <div class="torch-glow glow-right"></div>

  <header class="scene-title">
    <small>HOLLOW ARCHIVE • THE BURIED VAULT</small>
    <h1>The Weight Room</h1>
  </header>

  <button id="fullscreenBtn" class="rune-btn fullscreen-btn" type="button" aria-label="Πλήρης οθόνη">⛶</button>
  <button id="gmToggle" class="rune-btn gm-btn hidden" type="button" aria-label="Έλεγχος Αφηγητή">✦</button>

  <section class="doors" aria-label="Τρεις πέτρινες θύρες">
    <div class="door-wrap" data-door="0"><div class="door-stone"><div class="door-panel left"></div><div class="door-panel right"></div><div class="door-sigil">◇</div></div></div>
    <div class="door-wrap" data-door="1"><div class="door-stone"><div class="door-panel left"></div><div class="door-panel right"></div><div class="door-sigil">○</div></div></div>
    <div class="door-wrap" data-door="2"><div class="door-stone"><div class="door-panel left"></div><div class="door-panel right"></div><div class="door-sigil">△</div></div></div>
  </section>

  <section id="pedestals" class="pedestals" aria-label="Τέσσερα βάθρα"></section>
  <section id="stoneField" class="stone-field" aria-label="Λίθινες σφαίρες"></section>

  <div id="inscription" class="inscription hidden"><span id="inscriptionText"></span></div>
  <div id="success" class="success hidden"><div class="success-rune">✧</div><div>Ο μηχανισμός ισορρόπησε.</div></div>
  <div id="syncState" class="sync-state">σύνδεση…</div>
  <div id="noScene" class="no-scene hidden">Δεν υπάρχει ενεργή σκηνή στο Owlbear Rodeo.</div>

  <aside id="gmDrawer" class="gm-drawer hidden">
    <div class="gm-heading">Έλεγχος Αφηγητή</div>
    <label>Πραγματική θύρα
      <select id="realDoor"><option value="0">Αριστερή</option><option value="1">Μεσαία</option><option value="2">Δεξιά</option></select>
    </label>
    <button id="hint1">Αποκάλυψη — Investigation DC 12</button>
    <button id="hint2">Αποκάλυψη — Investigation DC 14</button>
    <button id="hideHints">Απόκρυψη ένδειξης</button>
    <button id="reset" class="danger">Επαναφορά γρίφου</button>
    <details><summary>Διαγνωστικά</summary><div id="diagnostics"></div></details>
  </aside>
</main>
<script type="module" src="./app.js?v=200"></script>
</body>
</html>
