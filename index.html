<!doctype html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hollow Archive</title>
  <link rel="stylesheet" href="./styles.css?v=930">
</head>
<body>
<main class="app-shell">
  <section id="scene" class="scene phase-1">
    <div class="scene-canvas">
      <div id="flash" class="flash"></div>

      <button id="fullscreenBtn" class="round fullscreen" type="button" aria-label="Πλήρης οθόνη">⛶</button>

      <section id="board" class="board" aria-label="Οι πέντε πέτρες">
        <div id="slots" class="slots"></div>
      </section>

      <section id="tray" class="tray"></section>

      <button id="gmToggle" class="round gm hidden" type="button" aria-label="Έλεγχοι GM">⚙</button>
      <aside id="gmDrawer" class="gm-drawer hidden">
        <button id="solve1Btn" type="button">Λύση 1ης φάσης</button>
        <button id="openBtn" type="button">Άνοιγμα</button>
        <button id="resetBtn" type="button" class="danger">Επαναφορά</button>
      </aside>
    </div>
  </section>
</main>
<script type="module" src="./app.js?v=930"></script>
</body>
</html>
